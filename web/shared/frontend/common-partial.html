  <style>
    .home-link { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px 3px 6px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--text2); text-decoration: none; font-size: 12px; margin-right: 10px; }
    .home-link:hover { border-color: var(--primary); color: var(--text); }

    .btn { display: inline-block; padding: 10px 24px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 14px; }
    .btn:hover { background: var(--surface2); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover { opacity: .85; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.xs { font-size: 11px; padding: 2px 8px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }

    /* Shared tab bar — used by crypto, network, misc, mock, k8s and svcreg.
       Kept global (not per-module) so every module gets identical tabs and the
       same mobile behavior; new modules just use .tabs / .tab. */
    .tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .tab { padding: 10px 20px; border: none; background: none; color: var(--text2); cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab.active { color: var(--text); border-bottom-color: var(--primary); }
    .tab:hover { color: var(--text); }

    .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
    .msg.error { background: #3d1f2a; border: 1px solid #e94560; color: #e94560; }

    /* Mobile baseline — injected into all module frontends via make inject-shared.
       Additive, non-conflicting utilities only. Per-module layout overrides belong
       in each App.svelte <style>. */
    *, *::before, *::after { -webkit-tap-highlight-color: transparent; }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    @media (max-width: 640px) {
      .btn { padding: 12px 20px; }
      .card { padding: 16px; }

      /* Scrollable tab bar: keep labels on one line and let the bar scroll
         horizontally instead of wrapping labels / clipping the last tab. */
      .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { flex: 0 0 auto; white-space: nowrap; padding: 10px 14px; }
    }
  </style>
