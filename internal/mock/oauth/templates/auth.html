<!DOCTYPE html>
<html>
<head>
    <title>Authorization Request</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h1>Authorization Request</h1>
    <p>Hello, <strong>{{.User.Username}}</strong>!</p>
    <p>The application <strong>{{.Client.Name}}</strong> requests access to your account.</p>

    <div class="permissions">
        <h3>Permissions Requested:</h3>
        <ul>
            <li>Read your basic information</li>
            <li>Access your email address</li>
        </ul>
    </div>

    <form method="POST">
        <div class="actions">
            <button type="submit" name="decision" value="allow" class="btn-allow">Allow</button>
            <button type="submit" name="decision" value="deny" class="btn-deny">Deny</button>
        </div>
    </form>
</div>
</body>
</html>
