name: release

# This workflow will run on master branch and on any pull requests targeting master
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26

      - name: Build
        run: make releases

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          # Only the packed archives are published; never a raw, un-archived
          # binary (which would otherwise lose its exec bit across downloads).
          files: |
            bin/*.tar.gz
            bin/*.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
